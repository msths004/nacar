region_id: "_template_region"
display_name: "Plantilla de Escalabilidad Regional (Fase 3)"
status: "pending_research"
latitude_deg: null
longitude_deg: null
hydrogeochemistry_type: "pending_classification"
notes: >
  Plantilla vacía para incorporar nuevas cuencas del mundo en la Fase 3.
  Si la región objetivo corresponde a aguas blandas o neutras con SI_c <= 0
  (baja concentración de Ca2+ y alcalinidad HCO3-), la ecuación kárstica
  se apaga automáticamente (R_calcita_P = 0) y todo el fósforo es asumido
  por macrófitas y bacterias CWM1. Todos los parámetros aquí marcados como
  'pending' deben investigarse antes de un despliegue real.

